# Golden evaluation set — 15 cases across 5 categories
#
# IMPORTANT: All numeric expected values are fixture-contract values defined in
# finagent/eval/fixtures.py. They are used for offline scoring only. Before any
# published eval run, values must be re-verified against live SEC EDGAR data.
#
# Categories: 3 single · 3 trend · 4 multi-company · 3 narrative · 2 adversarial = 15
#
# expected_behavior: answer | produce_table | ask | degrade
# expected_cells: "TICKER|alias|CY####Q#" -> displayed string (millions, 2dp)

- id: single_01
  category: single
  question: "What was AAPL revenue for calendar 2024Q1 in USD millions?"
  expected_behavior: answer
  expected_cells:
    "AAPL|revenue|CY2024Q1": "119580.00"
  expected_plan:
    - AAPL
    - revenue

- id: single_02
  category: single
  question: "Show me Microsoft net income for CY2024Q2."
  expected_behavior: answer
  expected_cells:
    "MSFT|net_income|CY2024Q2": "22586.00"
  expected_plan:
    - MSFT
    - net_income

- id: single_03
  category: single
  question: "What was NVDA gross profit in calendar Q3 2024?"
  expected_behavior: answer
  expected_cells:
    "NVDA|gross_profit|CY2024Q3": "25122.00"
  expected_plan:
    - NVDA
    - gross_profit

